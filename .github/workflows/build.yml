name: build

on:
  push:
    branches: [tarmac]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (arm64, bundled deps)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - name: Configure
        run: cmake --preset default
      - name: Build
        run: cmake --build build -j3
      - name: Install
        run: cmake --install build
      - name: Smoke test (binary loads its libraries)
        run: |
          ls -la install
          otool -L install/arculator | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: arculator-macos-arm64
          path: install/
          if-no-files-found: error

  linux:
    name: Linux (system deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libsdl2-dev libwxgtk3.2-dev zlib1g-dev libgtk-3-dev libx11-dev libasound2-dev
      - name: Configure
        run: cmake --preset default
      - name: Build
        run: cmake --build build -j4
      - name: Install
        run: cmake --install build

  windows:
    name: Windows (MSYS2 MINGW64, system deps)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libpcap
            mingw-w64-x86_64-wxwidgets3.2-msw
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
      - name: Configure
        run: cmake --preset msys2-mingw64 -DARCULATOR_BUNDLE_DEPENDENCIES=OFF
      - name: Build
        run: cmake --build build-mingw64 -j4
      - name: Install
        run: cmake --install build-mingw64
      - name: Bundle runtime DLLs
        run: |
          cd install
          ldd arculator.exe | grep mingw64 | awk '{print $3}' | xargs -I{} cp -u {} .
          ls
      - uses: actions/upload-artifact@v4
        with:
          name: arculator-windows-x64
          path: install/
          if-no-files-found: error
